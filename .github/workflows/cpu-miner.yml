name: CPU Miner CI (Foundation Polish)

on:
  push:
    branches:
      - jules-initial-miner-cli-foundation-12843542801582357184
  pull_request:
    branches:
      - jules-initial-miner-cli-foundation-12843542801582357184
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

  benchmark:
    name: Benchmark on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark
        run: cargo run --bin miner-cli -- --benchmark-native-cpu --benchmark-output benchmark_report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ matrix.os }}
          path: benchmark_report.json

  stratum-capture:
    name: Stratum Capture Tool on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check format
        run: cd tools/stratum-capture && cargo fmt -- --check

      - name: Run clippy
        run: cd tools/stratum-capture && cargo clippy -- -D warnings

      - name: Run tests
        run: cd tools/stratum-capture && cargo test

      - name: Build
        run: cd tools/stratum-capture && cargo build
