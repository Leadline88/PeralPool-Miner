[package]
name = "miner-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { path = "../../core/config" }
logging = { path = "../../core/logging" }
process = { path = "../../core/process" }
watchdog = { path = "../../core/watchdog" }
mining = { path = "../../core/mining" }
algo-pearl = { path = "../../algos/pearl" }
backend-cpu = { path = "../../backends/cpu" }
scheduler = { path = "../../core/scheduler" }
stats = { path = "../../core/stats" }
devfee = { path = "../../core/devfee" }
stratum = { path = "../../core/stratum" }
shares = { path = "../../core/shares" }
pearlpool = { path = "../../integrations/pearlpool" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
num_cpus = "1.0"
hex = "0.4"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
