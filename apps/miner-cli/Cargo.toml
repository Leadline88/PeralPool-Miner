[package]
name = "miner-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
config = { path = "../../core/config" }
logging = { path = "../../core/logging" }
watchdog = { path = "../../core/watchdog" }
devfee = { path = "../../core/devfee" }
pearlpool = { path = "../../integrations/pearlpool" }
tracing = "0.1.44"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
