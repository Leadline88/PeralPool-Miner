[package]
name = "stratum"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
shares = { path = "../shares" }
stats = { path = "../stats" }
